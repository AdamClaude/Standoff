# Render Blueprint: one free web service runs BOTH the game page and the realtime game server
# (rooms, timers, bots). Free plan sleeps after ~15 minutes idle; the first visitor after that
# waits ~1 minute while it wakes up.
services:
  - type: web
    name: standoff-server
    runtime: node
    plan: free
    # --include=dev: the page is built with Vite, a dev dependency.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
